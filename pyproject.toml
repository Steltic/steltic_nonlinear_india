[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steltic-nonlinear-india"
version = "0.3.1"
description = "steltic_nonlinear_india (SNL-IN): India fork — IS 1893-oriented NLRHA + pushover scaffolding + DDM on a steltic_india HR package; ASCE Ch.16/41 retained as non-authoritative scaffolding behind RAG gates"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = ["openseespy>=3.5", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
# the Feedback tab server the Steltic hub embeds (snl.loop_server); the CLI needs none of these
hub = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
snl = "snl.cli:main"
mesh-converge = "mesh_convergence.driver:cli_main"

[tool.setuptools]
packages = ["snl", "pushover", "nlrha", "steltic_ddm", "records", "mesh_convergence", "usa_reference"]

[tool.setuptools.package-data]
snl = ["four_analyses.css", "loop_ui/*", "india_collection_stems.json"]
pushover = ["aisc_shapes.csv", "hinge_params.json", "viewer_core.html", "vendor/*"]
nlrha = ["ch16_params.json", "viewer_core.html", "vendor/*"]
steltic_ddm = ["data/*", "viewer_core.html", "vendor/*"]
records = ["p695_farfield/*", "p695_farfield/*/*"]
